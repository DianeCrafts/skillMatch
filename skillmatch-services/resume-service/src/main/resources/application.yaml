server:
  port: 8082
spring:
  application:
    name: resume-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  profiles:
    default: dev

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

